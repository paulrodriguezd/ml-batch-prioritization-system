name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data and check it is reproducible
        run: |
          python scripts/generate_data.py
          sha256sum data/raw/*.csv > first.sha
          python scripts/generate_data.py
          sha256sum -c first.sha

      - name: Run tests
        run: pytest -q
